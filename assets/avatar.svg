<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="150" cy="150" r="145" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />
  
  <!-- Outer Glow Ring -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="150" cy="150" r="132" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

  <!-- Security Grid Lines -->
  <path d="M 50 150 H 250 M 150 50 V 250" stroke="#0ea5e9" stroke-width="0.75" opacity="0.2" />
  <circle cx="150" cy="150" r="85" fill="none" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.25" />

  <!-- Central Shield Container -->
  <path d="M 150 75 
           C 195 75, 215 90, 215 135 
           C 215 190, 150 225, 150 225 
           C 150 225, 85 190, 85 135 
           C 85 90, 105 75, 150 75 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#cyanGlow)" 
        stroke-width="3" 
        filter="url(#glow)" />

  <!-- Inner Security Key / Monogram Graphic -->
  <!-- Monogram D S with Cyber Key -->
  <path d="M 125 110 H 145 C 162 110, 172 120, 172 135 C 172 150, 162 160, 145 160 H 125 Z" 
        fill="none" 
        stroke="#f8fafc" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <line x1="125" y1="110" x2="125" y2="185" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />

  <!-- Red Hat & Linux System Dot Indicator -->
  <circle cx="185" cy="175" r="7" fill="#ef4444" stroke="#fecaca" stroke-width="1.5" />
  <circle cx="150" cy="195" r="4" fill="#00f2fe" />
  <circle cx="115" cy="175" r="4" fill="#38bdf8" />
  
  <!-- Subtle Binary / Tech Accent -->
  <text x="150" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="3" text-anchor="middle">DEVAGANESH S</text>
  <text x="150" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#64748b" letter-spacing="1.5" text-anchor="middle">CYBERSECURITY • RHCSA</text>
</svg>
