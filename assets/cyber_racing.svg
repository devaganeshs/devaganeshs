<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberTrackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030611" />
      <stop offset="50%" stop-color="#081024" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing filter effects -->
    <filter id="carGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="trackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Digital Grid Pattern -->
    <pattern id="racingGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="30" cy="30" r="0.75" fill="#0ea5e9" opacity="0.2" />
    </pattern>

    <!-- Path for animateMotion -->
    <path id="circuitMotionPath" d="M 160 160 C 160 65, 360 65, 500 160 C 640 255, 840 255, 840 160 C 840 65, 640 65, 500 160 C 360 255, 160 255, 160 160 Z" />
  </defs>

  <!-- Container Base -->
  <rect width="1000" height="320" fill="url(#cyberTrackBg)" rx="12" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Grid Texture -->
  <rect width="1000" height="320" fill="url(#racingGrid)" rx="12" />

  <!-- Ambient Light Backdrops -->
  <circle cx="160" cy="160" r="140" fill="#00f2fe" opacity="0.05" filter="url(#carGlow)" />
  <circle cx="840" cy="160" r="140" fill="#0ea5e9" opacity="0.05" filter="url(#carGlow)" />
  <circle cx="500" cy="160" r="100" fill="#10b981" opacity="0.04" filter="url(#carGlow)" />

  <!-- Top Futuristic HUD Bar -->
  <g transform="translate(40, 30)">
    <!-- Circuit Title Badge -->
    <rect x="0" y="0" width="260" height="24" rx="6" fill="#0b1426" stroke="#0284c7" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">CYBER CONTRIBUTION RACING</text>

    <!-- Telemetry Badges -->
    <text x="320" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">TELEMETRY: <tspan fill="#00f2fe">LIVE_STREAM</tspan></text>
    <text x="540" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">TRACK: <tspan fill="#38bdf8">CONTRIBUTION_INFINITY_LOOP</tspan></text>
    <text x="830" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981">STATUS: ACTIVE ●</text>
  </g>

  <!-- RACING CIRCUIT TRACK -->
  <g>
    <!-- Background Road Width Bed -->
    <path d="M 160 160 C 160 65, 360 65, 500 160 C 640 255, 840 255, 840 160 C 840 65, 640 65, 500 160 C 360 255, 160 255, 160 160 Z" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- Road Border Glowing Curbs (Cyan Outer / Blue Inner) -->
    <path d="M 160 160 C 160 65, 360 65, 500 160 C 640 255, 840 255, 840 160 C 840 65, 640 65, 500 160 C 360 255, 160 255, 160 160 Z" 
          fill="none" 
          stroke="#0284c7" 
          stroke-width="26" 
          opacity="0.3" />

    <!-- Center Line Pulse Track -->
    <path d="M 160 160 C 160 65, 360 65, 500 160 C 640 255, 840 255, 840 160 C 840 65, 640 65, 500 160 C 360 255, 160 255, 160 160 Z" 
          fill="none" 
          stroke="url(#cyanNeon)" 
          stroke-width="3" 
          stroke-dasharray="12 8" 
          filter="url(#trackGlow)" />

    <!-- Inner Core Guide -->
    <path d="M 160 160 C 160 65, 360 65, 500 160 C 640 255, 840 255, 840 160 C 840 65, 640 65, 500 160 C 360 255, 160 255, 160 160 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1" 
          opacity="0.6" />
  </g>

  <!-- CONTRIBUTION TELEMETRY DATA MILESTONES (Checkpoints) -->
  <!-- Checkpoint 1: COMMITS -->
  <g transform="translate(160, 160)">
    <circle cx="0" cy="0" r="16" fill="#091329" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="#0284c7">
      <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#0284c7;#00f2fe;#0284c7" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">CP_01: COMMITS</text>
  </g>

  <!-- Checkpoint 2: SYSTEM ATTESTATION -->
  <g transform="translate(500, 160)">
    <circle cx="0" cy="0" r="16" fill="#091329" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="#00f2fe">
      <animate attributeName="r" values="6;10;6" dur="3s" begin="0.75s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#00f2fe;#38bdf8;#00f2fe" dur="3s" begin="0.75s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#00f2fe" text-anchor="middle">CP_02: ZERO_TRUST</text>
  </g>

  <!-- Checkpoint 3: CODE DEPLOYMENT -->
  <g transform="translate(840, 160)">
    <circle cx="0" cy="0" r="16" fill="#091329" stroke="#10b981" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="#10b981">
      <animate attributeName="r" values="6;10;6" dur="3s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#10b981;#00f2fe;#10b981" dur="3s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">CP_03: DEPLOY</text>
  </g>

  <!-- THE FUTURISTIC CYBER CAR (SMIL animateMotion - 100% Universal Compatibility) -->
  <g>
    <!-- Animate the car along the SVG path with automatic rotation -->
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#circuitMotionPath" />
    </animateMotion>

    <!-- Thruster Trail -->
    <ellipse cx="-24" cy="0" rx="14" ry="4" fill="#00f2fe" opacity="0.8" filter="url(#carGlow)" />
    <polygon points="-16,-4 -34,0 -16,4" fill="#38bdf8" opacity="0.9" />

    <!-- Aerodynamic Chassis -->
    <path d="M 24 0 
             C 22 -6, 12 -9, -4 -9 
             C -14 -9, -18 -7, -22 -6 
             C -24 -3, -24 3, -22 6 
             C -18 7, -14 9, -4 9 
             C 12 9, 22 6, 24 0 Z" 
          fill="#0a1226" 
          stroke="#00f2fe" 
          stroke-width="1.75" 
          filter="url(#carGlow)" />

    <!-- Cockpit Glass -->
    <path d="M 12 0 C 8 -4, 0 -5, -8 -4 C -8 0, -8 0, -8 4 C 0 5, 8 4, 12 0 Z" 
          fill="#0284c7" 
          stroke="#38bdf8" 
          stroke-width="1" />
    
    <!-- Shield Insignia -->
    <polygon points="17,0 13,-2.5 13,2.5" fill="#ffffff" />
    <circle cx="2" cy="0" r="2" fill="#00f2fe" />

    <!-- Headlight Beams -->
    <polygon points="23,-5 42,-8 42,-2" fill="#00f2fe" opacity="0.7" filter="url(#carGlow)" />
    <polygon points="23,5 42,2 42,8" fill="#00f2fe" opacity="0.7" filter="url(#carGlow)" />
    
    <!-- Wheel Glow Indicators -->
    <rect x="-14" y="-10" width="8" height="2" rx="1" fill="#38bdf8" />
    <rect x="-14" y="8" width="8" height="2" rx="1" fill="#38bdf8" />
    <rect x="10" y="-9" width="7" height="2" rx="1" fill="#38bdf8" />
    <rect x="10" y="7" width="7" height="2" rx="1" fill="#38bdf8" />
  </g>

  <!-- Bottom Diagnostic Telemetry Footer -->
  <g transform="translate(40, 292)">
    <line x1="0" y1="-10" x2="920" y2="-10" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">MODE: AUTONOMOUS TELEMETRY • VEHICLE: DEVAGANESH-SEC-01 • CIRCUIT: INFINITY_CONTRIBUTION_LOOP</text>
    <text x="750" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#10b981">INTEGRITY: 100% VERIFIED [PASS]</text>
  </g>
</svg>
