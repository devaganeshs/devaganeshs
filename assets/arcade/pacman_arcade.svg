<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pacman-body {
        animation: movePacman 10s infinite linear;
      }
      .ghost-cyan {
        animation: moveGhost1 10s infinite linear;
      }
      .ghost-red {
        animation: moveGhost2 10s infinite linear;
      }
      .dot-eaten-1 { animation: eatDot1 10s infinite; }
      .dot-eaten-2 { animation: eatDot2 10s infinite; }
      .dot-eaten-3 { animation: eatDot3 10s infinite; }
      .dot-eaten-4 { animation: eatDot4 10s infinite; }
      .dot-eaten-5 { animation: eatDot5 10s infinite; }
      .dot-eaten-6 { animation: eatDot6 10s infinite; }
      .dot-eaten-7 { animation: eatDot7 10s infinite; }

      @keyframes movePacman {
        0% { transform: translateX(40px); }
        80% { transform: translateX(820px); opacity: 1; }
        81% { transform: translateX(820px); opacity: 0; }
        82% { transform: translateX(40px); opacity: 0; }
        85% { opacity: 1; }
        100% { transform: translateX(40px); }
      }

      @keyframes moveGhost1 {
        0% { transform: translateX(0px); }
        80% { transform: translateX(780px); opacity: 1; }
        81% { opacity: 0; }
        85% { opacity: 0; }
        86% { transform: translateX(0px); opacity: 1; }
        100% { transform: translateX(0px); }
      }

      @keyframes moveGhost2 {
        0% { transform: translateX(-45px); }
        80% { transform: translateX(735px); opacity: 1; }
        81% { opacity: 0; }
        85% { opacity: 0; }
        86% { transform: translateX(-45px); opacity: 1; }
        100% { transform: translateX(-45px); }
      }

      @keyframes eatDot1 { 0%, 10% { opacity: 1; } 12%, 85% { opacity: 0.15; } 90%, 100% { opacity: 1; } }
      @keyframes eatDot2 { 0%, 20% { opacity: 1; } 22%, 85% { opacity: 0.15; } 90%, 100% { opacity: 1; } }
      @keyframes eatDot3 { 0%, 30% { opacity: 1; } 32%, 85% { opacity: 0.15; } 90%, 100% { opacity: 1; } }
      @keyframes eatDot4 { 0%, 40% { opacity: 1; } 42%, 85% { opacity: 0.15; } 90%, 100% { opacity: 1; } }
      @keyframes eatDot5 { 0%, 50% { opacity: 1; } 52%, 85% { opacity: 0.15; } 90%, 100% { opacity: 1; } }
      @keyframes eatDot6 { 0%, 60% { opacity: 1; } 62%, 85% { opacity: 0.15; } 90%, 100% { opacity: 1; } }
      @keyframes eatDot7 { 0%, 70% { opacity: 1; } 72%, 85% { opacity: 0.15; } 90%, 100% { opacity: 1; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bgGrad)" rx="10" stroke="#1e293b" stroke-width="1.5" />

  <!-- Maze Grid Background Matrix (Simulating Contribution Grid) -->
  <g opacity="0.35">
    <!-- Grid Cells Row 1 -->
    <rect x="50" y="45" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="75" y="45" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="100" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="125" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="150" y="45" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="175" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="200" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="225" y="45" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="250" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="275" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="300" y="45" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="325" y="45" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="350" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="375" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="400" y="45" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="425" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="450" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="475" y="45" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="500" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="525" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="550" y="45" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="575" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="600" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="625" y="45" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="650" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="675" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="700" y="45" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="725" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="750" y="45" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="775" y="45" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="800" y="45" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="825" y="45" width="16" height="16" rx="3" fill="#39d353" />

    <!-- Grid Cells Row 3 -->
    <rect x="50" y="180" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="75" y="180" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="100" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="125" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="150" y="180" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="175" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="200" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="225" y="180" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="250" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="275" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="300" y="180" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="325" y="180" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="350" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="375" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="400" y="180" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="425" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="450" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="475" y="180" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="500" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="525" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="550" y="180" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="575" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="600" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="625" y="180" width="16" height="16" rx="3" fill="#0e4429" />
    <rect x="650" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="675" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="700" y="180" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="725" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="750" y="180" width="16" height="16" rx="3" fill="#39d353" />
    <rect x="775" y="180" width="16" height="16" rx="3" fill="#006d32" />
    <rect x="800" y="180" width="16" height="16" rx="3" fill="#26a641" />
    <rect x="825" y="180" width="16" height="16" rx="3" fill="#39d353" />
  </g>

  <!-- Cyan Cyber Maze Rails -->
  <path d="M 40 85 H 860" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />
  <path d="M 40 155 H 860" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Contribution Pellets (Active Middle Track) -->
  <circle cx="150" cy="120" r="5" fill="#38bdf8" filter="url(#glow)" class="dot-eaten-1" />
  <circle cx="260" cy="120" r="5" fill="#39d353" filter="url(#glow)" class="dot-eaten-2" />
  <circle cx="370" cy="120" r="7" fill="#00f2fe" filter="url(#glow)" class="dot-eaten-3" />
  <circle cx="480" cy="120" r="5" fill="#39d353" filter="url(#glow)" class="dot-eaten-4" />
  <circle cx="590" cy="120" r="5" fill="#38bdf8" filter="url(#glow)" class="dot-eaten-5" />
  <circle cx="700" cy="120" r="7" fill="#00f2fe" filter="url(#glow)" class="dot-eaten-6" />
  <circle cx="810" cy="120" r="5" fill="#39d353" filter="url(#glow)" class="dot-eaten-7" />

  <!-- Animated Ghosts -->
  <g class="ghost-red" transform="translate(0, 105)">
    <!-- Red Threat Ghost -->
    <path d="M 12 25 C 12 14, 28 14, 28 25 L 28 32 L 24 29 L 20 32 L 16 29 L 12 32 Z" fill="#ef4444" filter="url(#glow)" />
    <circle cx="17" cy="20" r="2.5" fill="#ffffff" />
    <circle cx="18" cy="20" r="1.2" fill="#0284c7" />
    <circle cx="23" cy="20" r="2.5" fill="#ffffff" />
    <circle cx="24" cy="20" r="1.2" fill="#0284c7" />
  </g>

  <g class="ghost-cyan" transform="translate(0, 105)">
    <!-- Cyan Cyber Ghost -->
    <path d="M 12 25 C 12 14, 28 14, 28 25 L 28 32 L 24 29 L 20 32 L 16 29 L 12 32 Z" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="17" cy="20" r="2.5" fill="#ffffff" />
    <circle cx="18" cy="20" r="1.2" fill="#0f172a" />
    <circle cx="23" cy="20" r="2.5" fill="#ffffff" />
    <circle cx="24" cy="20" r="1.2" fill="#0f172a" />
  </g>

  <!-- Animated Pac-Man -->
  <g class="pacman-body" transform="translate(0, 120)">
    <!-- Yellow / Neon Gold Pacman -->
    <circle cx="0" cy="0" r="16" fill="#facc15" filter="url(#glow)" />
    <!-- Mouth Wedge Cutout -->
    <polygon points="0,0 18,-10 18,10" fill="#0b1220" />
    <circle cx="-2" cy="-7" r="2.5" fill="#0f172a" />
  </g>

  <!-- Arcade HUD Overlay Header -->
  <g transform="translate(50, 25)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">1UP: DEVAGANESH</text>
    <text x="350" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe">HIGH SCORE: ACTIVE_COMMITS</text>
    <text x="670" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">LEVEL: CYBER_DEFENSE</text>
  </g>

  <!-- Arcade HUD Overlay Footer -->
  <g transform="translate(50, 222)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">MODE: PAC-MAN CONTRIBUTION MATRIX</text>
    <text x="650" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">LIVE GITHUB ACTIVITY CONSUMER</text>
  </g>
</svg>
