<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <linearGradient id="circuitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030611" />
      <stop offset="50%" stop-color="#080f21" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .racer {
        offset-path: path("M 100 120 C 100 50, 300 50, 450 120 C 600 190, 800 190, 800 120 C 800 50, 600 50, 450 120 C 300 190, 100 190, 100 120 Z");
        animation: raceCircuit 8s infinite linear;
      }
      @keyframes raceCircuit {
        0% { offset-distance: 0%; }
        100% { offset-distance: 100%; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" fill="url(#circuitBg)" rx="10" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Neon Racing Track (Infinity / Telemetry Loop) -->
  <path d="M 100 120 C 100 50, 300 50, 450 120 C 600 190, 800 190, 800 120 C 800 50, 600 50, 450 120 C 300 190, 100 190, 100 120 Z" 
        fill="none" 
        stroke="#0284c7" 
        stroke-width="16" 
        opacity="0.3" />
  
  <path d="M 100 120 C 100 50, 300 50, 450 120 C 600 190, 800 190, 800 120 C 800 50, 600 50, 450 120 C 300 190, 100 190, 100 120 Z" 
        fill="none" 
        stroke="#00f2fe" 
        stroke-width="3" 
        stroke-dasharray="8 6" 
        filter="url(#circuitGlow)" />

  <!-- Checkpoint Milestone Markers (Simulating Contribution Weeks) -->
  <g transform="translate(100, 120)">
    <circle cx="0" cy="0" r="7" fill="#10b981" filter="url(#circuitGlow)" />
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">CP1: RECON</text>
  </g>

  <g transform="translate(450, 120)">
    <circle cx="0" cy="0" r="7" fill="#38bdf8" filter="url(#circuitGlow)" />
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">CP2: BUILD</text>
  </g>

  <g transform="translate(800, 120)">
    <circle cx="0" cy="0" r="7" fill="#00f2fe" filter="url(#circuitGlow)" />
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">CP3: DEPLOY</text>
  </g>

  <!-- Animated Cyber Racer Vehicle -->
  <g class="racer">
    <!-- Vehicle Body -->
    <polygon points="12,0 -8,-6 -4,0 -8,6" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5" filter="url(#circuitGlow)" />
    <!-- Thruster Trail -->
    <circle cx="-10" cy="0" r="3" fill="#38bdf8" />
  </g>

  <!-- Top Header HUD -->
  <g transform="translate(40, 24)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe">🏎️ TELEMETRY CIRCUIT: ACTIVE</text>
    <text x="360" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">TRACK: CONTRIBUTION VELOCITY</text>
    <text x="700" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">BOOST: COMMITS_STREAM</text>
  </g>

  <!-- Bottom Subtitle HUD -->
  <g transform="translate(40, 222)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">MODE: CYBER CIRCUIT TELEMETRY &bull; ACTIVITY PACE MAPPED TO INFINITY TRACK</text>
  </g>
</svg>
