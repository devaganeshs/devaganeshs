<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#0b1326" />
    </linearGradient>

    <style>
      .cursor-blink { animation: blink 1s infinite; }
      .line-1 { animation: typeLine1 8s infinite; }
      .line-2 { animation: typeLine2 8s infinite; }
      .line-3 { animation: typeLine3 8s infinite; }
      .line-4 { animation: typeLine4 8s infinite; }
      .line-5 { animation: typeLine5 8s infinite; }

      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes typeLine1 { 0%, 10% { opacity: 0; } 15%, 100% { opacity: 1; } }
      @keyframes typeLine2 { 0%, 30% { opacity: 0; } 35%, 100% { opacity: 1; } }
      @keyframes typeLine3 { 0%, 50% { opacity: 0; } 55%, 100% { opacity: 1; } }
      @keyframes typeLine4 { 0%, 70% { opacity: 0; } 75%, 100% { opacity: 1; } }
      @keyframes typeLine5 { 0%, 85% { opacity: 0; } 90%, 100% { opacity: 1; } }
    </style>
  </defs>

  <!-- Terminal Window Base -->
  <rect width="900" height="240" fill="url(#termBg)" rx="10" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Terminal Titlebar -->
  <rect width="900" height="32" fill="#0b1120" rx="10" />
  <circle cx="20" cy="16" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="36" cy="16" r="4.5" fill="#eab308" opacity="0.8" />
  <circle cx="52" cy="16" r="4.5" fill="#10b981" opacity="0.8" />
  <text x="75" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b">devaganesh@security-node:~ (bash)</text>

  <!-- Terminal Stream Execution Output -->
  <g transform="translate(30, 65)">
    <!-- Line 1 -->
    <g class="line-1">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">devaganesh@node:~$ <tspan fill="#f8fafc">git fetch --activity https://github.com/devaganeshs</tspan></text>
    </g>

    <!-- Line 2 -->
    <g class="line-2" transform="translate(0, 26)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">[+] Synchronizing commit telemetry... 100% (Real Data Parsed)</text>
    </g>

    <!-- Line 3 -->
    <g class="line-3" transform="translate(0, 52)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe">[i] Verifying zero-trust node attestation &amp; crypto signatures (ML-KEM / ML-DSA)</text>
    </g>

    <!-- Line 4 -->
    <g class="line-4" transform="translate(0, 78)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">[✔] Status: <tspan fill="#10b981" font-weight="700">CONTINUOUS_INTEGRATION_ACTIVE</tspan> &bull; Mode: <tspan fill="#00f2fe">SECURITY_ARCADE</tspan></text>
    </g>

    <!-- Line 5 -->
    <g class="line-5" transform="translate(0, 104)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">devaganesh@node:~$ <tspan fill="#f8fafc">./launch_arcade_matrix.sh</tspan></text>
      <rect x="290" y="-11" width="8" height="14" fill="#00f2fe" class="cursor-blink" />
    </g>
  </g>

  <!-- Subtle Bottom Diagnostics -->
  <g transform="translate(30, 222)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">SYS_DIAG: KERNEL_OK &bull; SYSTEMD_UNITS: RUNNING &bull; LOC: KUMBAKONAM, TN, INDIA</text>
  </g>
</svg>
