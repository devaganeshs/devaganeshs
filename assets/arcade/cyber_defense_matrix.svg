<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .radar-sweep {
        transform-origin: 120px 120px;
        animation: radarRotate 6s infinite linear;
      }
      .node-pulse-1 { animation: pulseNode 3s infinite ease-in-out; }
      .node-pulse-2 { animation: pulseNode 3s infinite ease-in-out 0.75s; }
      .node-pulse-3 { animation: pulseNode 3s infinite ease-in-out 1.5s; }
      .node-pulse-4 { animation: pulseNode 3s infinite ease-in-out 2.25s; }
      
      .traffic-packet {
        animation: travelPacket 4s infinite linear;
      }

      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulseNode {
        0%, 100% { fill: #0e4429; r: 10px; }
        50% { fill: #39d353; r: 14px; filter: drop-shadow(0 0 6px #10b981); }
      }

      @keyframes travelPacket {
        0% { cx: 280px; cy: 80px; opacity: 0; }
        10% { opacity: 1; }
        35% { cx: 460px; cy: 150px; }
        70% { cx: 640px; cy: 80px; }
        90% { opacity: 1; }
        100% { cx: 820px; cy: 150px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="900" height="240" fill="url(#bgGrad2)" rx="10" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left: Threat Detection Radar -->
  <g transform="translate(10, 0)">
    <!-- Radar Rings -->
    <circle cx="120" cy="120" r="85" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="120" cy="120" r="60" fill="none" stroke="#0284c7" stroke-width="1" opacity="0.3" />
    <circle cx="120" cy="120" r="35" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
    <circle cx="120" cy="120" r="10" fill="#0284c7" opacity="0.6" />
    
    <!-- Crosshairs -->
    <line x1="35" y1="120" x2="205" y2="120" stroke="#0284c7" stroke-width="0.75" opacity="0.4" />
    <line x1="120" y1="35" x2="120" y2="205" stroke="#0284c7" stroke-width="0.75" opacity="0.4" />

    <!-- Radar Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 120 120 L 195 75 A 85 85 0 0 0 120 35 Z" fill="url(#cyberCyan)" opacity="0.15" />
      <line x1="120" y1="120" x2="195" y2="75" stroke="#00f2fe" stroke-width="2" opacity="0.8" filter="url(#glow2)" />
    </g>

    <!-- Radar Blips -->
    <circle cx="95" cy="85" r="3" fill="#10b981" filter="url(#glow2)" />
    <circle cx="155" cy="145" r="3" fill="#38bdf8" filter="url(#glow2)" />
    <circle cx="160" cy="80" r="3" fill="#ef4444" filter="url(#glow2)" />
  </g>

  <!-- Central & Right: Cyber Defense Contribution Network -->
  <g>
    <!-- Connecting Backbone Circuits -->
    <path d="M 280 80 L 460 150 L 640 80 L 820 150" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.5" stroke-dasharray="6 4" />
    <path d="M 280 150 L 460 80 L 640 150 L 820 80" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6" />

    <!-- Active Moving Packet -->
    <circle cx="280" cy="80" r="6" fill="#00f2fe" filter="url(#glow2)" class="traffic-packet" />

    <!-- Network Node 1: Ingestion -->
    <g transform="translate(280, 80)">
      <circle cx="0" cy="0" r="18" fill="#0b1329" stroke="#0284c7" stroke-width="2" />
      <circle cx="0" cy="0" r="10" class="node-pulse-1" />
      <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">NODE_01: COMMIT</text>
    </g>

    <!-- Network Node 2: Inspection -->
    <g transform="translate(460, 150)">
      <circle cx="0" cy="0" r="18" fill="#0b1329" stroke="#0284c7" stroke-width="2" />
      <circle cx="0" cy="0" r="10" class="node-pulse-2" />
      <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">NODE_02: SCAN</text>
    </g>

    <!-- Network Node 3: Verification -->
    <g transform="translate(640, 80)">
      <circle cx="0" cy="0" r="18" fill="#0b1329" stroke="#0284c7" stroke-width="2" />
      <circle cx="0" cy="0" r="10" class="node-pulse-3" />
      <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">NODE_03: ATTEST</text>
    </g>

    <!-- Network Node 4: Secure State -->
    <g transform="translate(820, 150)">
      <circle cx="0" cy="0" r="18" fill="#0b1329" stroke="#10b981" stroke-width="2" filter="url(#glow2)" />
      <circle cx="0" cy="0" r="10" class="node-pulse-4" />
      <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" text-anchor="middle">NODE_04: SECURED</text>
    </g>
  </g>

  <!-- Top Header HUD -->
  <g transform="translate(40, 24)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe">🛡️ DEFENSE MATRIX: ACTIVE</text>
    <text x="350" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">POLICY: ZERO-TRUST OPA</text>
    <text x="640" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">INTEGRITY: 100% VERIFIED</text>
  </g>

  <!-- Bottom Subtitle HUD -->
  <g transform="translate(40, 222)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">STAGE: TELEMETRY STREAM &bull; GITHUB ACTIVITY MAPPED TO SECURITY DEFENSE NODES</text>
  </g>
</svg>
