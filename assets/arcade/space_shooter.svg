<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#090e1c" />
      <stop offset="100%" stop-color="#010307" />
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .ship-movement {
        animation: shipStrafe 6s infinite ease-in-out;
      }
      .laser-1 { animation: fireLaser1 2s infinite ease-out; }
      .laser-2 { animation: fireLaser2 2s infinite ease-out 0.5s; }
      .laser-3 { animation: fireLaser3 2s infinite ease-out 1s; }

      .enemy-hit-1 { animation: flashHit 2s infinite; }
      .enemy-hit-2 { animation: flashHit 2s infinite 0.5s; }
      .enemy-hit-3 { animation: flashHit 2s infinite 1s; }

      @keyframes shipStrafe {
        0%, 100% { transform: translateY(0px); }
        30% { transform: translateY(-40px); }
        70% { transform: translateY(40px); }
      }

      @keyframes fireLaser1 {
        0% { transform: translateX(0px); opacity: 1; }
        100% { transform: translateX(650px); opacity: 0; }
      }
      @keyframes fireLaser2 {
        0% { transform: translateX(0px); opacity: 1; }
        100% { transform: translateX(650px); opacity: 0; }
      }
      @keyframes fireLaser3 {
        0% { transform: translateX(0px); opacity: 1; }
        100% { transform: translateX(650px); opacity: 0; }
      }

      @keyframes flashHit {
        0%, 80% { fill: #00f2fe; filter: none; }
        90% { fill: #ffffff; filter: drop-shadow(0 0 8px #00f2fe); }
        100% { fill: #0284c7; filter: none; }
      }
    </style>
  </defs>

  <!-- Space Base -->
  <rect width="900" height="240" fill="url(#spaceBg)" rx="10" stroke="#1e293b" stroke-width="1.5" />

  <!-- Stars Background -->
  <circle cx="120" cy="40" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="340" cy="180" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="560" cy="50" r="1.5" fill="#00f2fe" opacity="0.5" />
  <circle cx="780" cy="200" r="1" fill="#38bdf8" opacity="0.7" />
  <circle cx="450" cy="110" r="1" fill="#ffffff" opacity="0.3" />
  <circle cx="220" cy="210" r="1.5" fill="#00f2fe" opacity="0.4" />

  <!-- Spaceship Player (Left Side) -->
  <g class="ship-movement" transform="translate(100, 120)">
    <!-- Cyber Interceptor Ship -->
    <polygon points="25,0 -15,-16 -5,0 -15,16" fill="#0284c7" stroke="#00f2fe" stroke-width="2" filter="url(#laserGlow)" />
    <polygon points="10,0 -8,-7 -2,0 -8,7" fill="#0f172a" />
    <circle cx="-2" cy="0" r="3" fill="#00f2fe" />
    <!-- Engine Jet Glow -->
    <polygon points="-12,-4 -24,0 -12,4" fill="#00f2fe" opacity="0.8" />
  </g>

  <!-- Fired Lasers -->
  <g transform="translate(130, 120)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)" class="laser-1" />
  </g>
  <g transform="translate(130, 80)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)" class="laser-2" />
  </g>
  <g transform="translate(130, 160)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#10b981" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)" class="laser-3" />
  </g>

  <!-- Target Contribution Grid Fleet (Right Side) -->
  <g transform="translate(680, 50)">
    <!-- Formation Block Grid -->
    <rect x="0" y="0" width="18" height="18" rx="4" class="enemy-hit-1" />
    <rect x="30" y="0" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="60" y="0" width="18" height="18" rx="4" fill="#00f2fe" />
    <rect x="90" y="0" width="18" height="18" rx="4" fill="#0284c7" />
    <rect x="120" y="0" width="18" height="18" rx="4" fill="#10b981" />

    <rect x="0" y="30" width="18" height="18" rx="4" fill="#0284c7" />
    <rect x="30" y="30" width="18" height="18" rx="4" class="enemy-hit-2" />
    <rect x="60" y="30" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="90" y="30" width="18" height="18" rx="4" fill="#00f2fe" />
    <rect x="120" y="30" width="18" height="18" rx="4" fill="#0284c7" />

    <rect x="0" y="60" width="18" height="18" rx="4" fill="#00f2fe" />
    <rect x="30" y="60" width="18" height="18" rx="4" fill="#0284c7" />
    <rect x="60" y="60" width="18" height="18" rx="4" class="enemy-hit-3" />
    <rect x="90" y="60" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="120" y="60" width="18" height="18" rx="4" fill="#00f2fe" />

    <rect x="0" y="90" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="30" y="90" width="18" height="18" rx="4" fill="#00f2fe" />
    <rect x="60" y="90" width="18" height="18" rx="4" fill="#0284c7" />
    <rect x="90" y="90" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="120" y="90" width="18" height="18" rx="4" fill="#0284c7" />

    <rect x="0" y="120" width="18" height="18" rx="4" fill="#0284c7" />
    <rect x="30" y="120" width="18" height="18" rx="4" fill="#10b981" />
    <rect x="60" y="120" width="18" height="18" rx="4" fill="#00f2fe" />
    <rect x="90" y="120" width="18" height="18" rx="4" fill="#0284c7" />
    <rect x="120" y="120" width="18" height="18" rx="4" fill="#10b981" />
  </g>

  <!-- Top Header HUD -->
  <g transform="translate(40, 24)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe">🚀 MISSION: CYBER INTERCEPTOR</text>
    <text x="360" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">TARGETS: CONTRIBUTION BLOCKS</text>
    <text x="700" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">SHIELDS: 100%</text>
  </g>

  <!-- Bottom Subtitle HUD -->
  <g transform="translate(40, 222)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b">MODE: SPACE DEFENSE ARCADE &bull; CONTRIBUTION MATRIX TARGETING</text>
  </g>
</svg>
