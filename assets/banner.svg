<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>
    
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#0ea5e9" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="12" />
  
  <!-- Subtle Grid Texture -->
  <rect width="1200" height="360" fill="url(#gridPattern)" rx="12" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="#00f2fe" opacity="0.04" filter="url(#cyanGlow)" />
  <circle cx="1050" cy="280" r="200" fill="#0ea5e9" opacity="0.04" filter="url(#cyanGlow)" />
  <circle cx="920" cy="90" r="120" fill="#10b981" opacity="0.03" filter="url(#cyanGlow)" />

  <!-- Decorative Circuit / System Topology Lines on Right Side -->
  <g opacity="0.45">
    <path d="M 780 70 H 940 L 980 110 H 1120" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 820 150 H 900 L 940 190 H 1150" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 750 240 H 870 L 910 200 H 1060 L 1100 240 H 1180" fill="none" stroke="#0284c7" stroke-width="1.25" stroke-dasharray="6 3" />
    <path d="M 940 190 V 270 L 980 310 H 1100" fill="none" stroke="#10b981" stroke-width="1.25" />
    
    <!-- Topology Nodes -->
    <circle cx="780" cy="70" r="3" fill="#00f2fe" />
    <circle cx="940" cy="70" r="4" fill="#38bdf8" />
    <circle cx="980" cy="110" r="5" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="1120" cy="110" r="3" fill="#38bdf8" />

    <circle cx="820" cy="150" r="3" fill="#38bdf8" />
    <circle cx="900" cy="150" r="4" fill="#00f2fe" />
    <circle cx="940" cy="190" r="6" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="1150" cy="190" r="4" fill="#38bdf8" />

    <circle cx="910" cy="200" r="4" fill="#10b981" />
    <circle cx="980" cy="310" r="4" fill="#10b981" filter="url(#softGlow)" />
    <circle cx="1100" cy="310" r="3" fill="#10b981" />
  </g>

  <!-- Left Side Security Shield & Cryptographic Motif Card -->
  <g transform="translate(60, 48)">
    <!-- Terminal / System Card Container -->
    <rect width="210" height="264" rx="10" fill="url(#badgeGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect width="210" height="32" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="18" cy="16" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="32" cy="16" r="4" fill="#eab308" opacity="0.8" />
    <circle cx="46" cy="16" r="4" fill="#10b981" opacity="0.8" />
    <text x="70" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" fill="#64748b">sys_sec.sh</text>

    <!-- Security Core Shield Symbol -->
    <path d="M 105 70 
             C 142 70, 158 82, 158 118 
             C 158 162, 105 190, 105 190 
             C 105 190, 52 162, 52 118 
             C 52 82, 68 70, 105 70 Z" 
          fill="#0a101f" 
          stroke="url(#cyanAccent)" 
          stroke-width="2.5" 
          filter="url(#softGlow)" />

    <!-- Inner Lock / Key Silhouette -->
    <path d="M 92 114 V 104 C 92 96.8, 97.8 91, 105 91 C 112.2 91, 118 96.8, 118 104 V 114" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <rect x="85" y="114" width="40" height="28" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="105" cy="126" r="3" fill="#ffffff" />
    <path d="M 105 129 V 134" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Terminal Status Diagnostics -->
    <text x="22" y="218" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#10b981">● SEC_LEVEL: HARDENED</text>
    <text x="22" y="234" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#38bdf8">● PROTOCOL: ZERO-TRUST</text>
    <text x="22" y="250" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#94a3b8">● PQC: ML-KEM / ML-DSA</text>
  </g>

  <!-- Central / Hero Text Content -->
  <g transform="translate(305, 58)">
    <!-- Top System Badge -->
    <g>
      <rect x="0" y="0" width="280" height="24" rx="12" fill="#0c192e" stroke="#0284c7" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#10b981" />
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">CYBERSECURITY &amp; SYSTEMS ENGINEER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1.5">DEVAGANESH S</text>

    <!-- Secondary Tagline -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="url(#cyanAccent)" letter-spacing="0.5">Linux &amp; System Administration • Web Security • Cryptography • Security Engineering</text>

    <!-- Core Domains Badges / Chips -->
    <g transform="translate(0, 136)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="170" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">🛡️ Zero-Trust / PQC</text>

      <!-- Chip 2 -->
      <rect x="180" y="0" width="180" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="192" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">🐧 Linux SysAdmin</text>

      <!-- Chip 3 -->
      <rect x="370" y="0" width="170" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="382" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">⚡ ICS / OT Security</text>

      <!-- Chip 4 -->
      <rect x="550" y="0" width="190" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="562" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">🏆 4x Hackathon Winner</text>
    </g>

    <!-- Quick Credentials Bar -->
    <g transform="translate(0, 182)">
      <line x1="0" y1="0" x2="740" y2="0" stroke="#1e293b" stroke-width="1" />
      
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">🎓 B.Tech CSE (Cybersecurity) @ SRMIST</text>
      <circle cx="270" cy="20" r="2.5" fill="#38bdf8" />
      
      <text x="285" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">📊 CGPA: 8.2 / 10 (Top 10%)</text>
      <circle cx="475" cy="20" r="2.5" fill="#10b981" />

      <text x="490" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">📍 Kumbakonam, TN, India</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="358" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="3" fill="url(#cyanAccent)" />
</svg>
